name: Validate and publish Wiki v48 casino screenshots
on:
  push:
    branches: [wiki-v48-casino-screenshots]
    paths:
      - 'eryndor-wiki-v48-casino-screenshots.zip'
      - 'assets/screenshots/casino-hall.webp'
      - 'assets/screenshots/casino-blackjack.webp'
      - 'assets/screenshots/casino-slots.webp'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiki-v48-casino-screenshots
      - name: Install image verification tools
        run: python3 -m pip install 'Pillow>=10,<13' 'numpy>=1.26,<3'
      - name: Verify exactly the approved screenshots
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          from zipfile import ZipFile
          zip_path=Path("eryndor-wiki-v48-casino-screenshots.zip")
          if zip_path.exists():
              with ZipFile(zip_path) as archive:
                  expected={"casino-hall.webp","casino-blackjack.webp","casino-slots.webp"}
                  assert set(archive.namelist())==expected, "ZIP must contain exactly the three approved images"
                  dest=Path("assets/screenshots")
                  dest.mkdir(parents=True,exist_ok=True)
                  for name in sorted(expected):
                      (dest/name).write_bytes(archive.read(name))
          files = {
              "casino-hall.webp": ("44392fbe902f27686fc92b70420684ccb9ad873e57385c3c36e5fc21ae4b29cb", (1200,626)),
              "casino-blackjack.webp": ("df947c7f433036e0d27ee2a4b4d1927cfc7839fdaeb7f2470f72ebb4f4fc1984", (1200,618)),
              "casino-slots.webp": ("7cef4cff981da0d017a2230558dc01f3584880eff677b49a9ba3fa7bf8c92d6c", (714,474)),
          }
          root=Path("assets/screenshots")
          for filename,(expected_sha,expected_size) in files.items():
              path=root/filename
              assert path.exists(), "Missing approved screenshot: "+str(path)
              data=path.read_bytes()
              assert 10000<len(data)<115000
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
              assert hashlib.sha256(data).hexdigest()==expected_sha, "Screenshot differs from reviewed original: "+filename
              with Image.open(path) as im:
                  im.load()
                  assert im.format=="WEBP" and im.size==expected_size
              print("Verified:",filename,len(data),"bytes")
          PY
      - name: Build and validate both languages including offline screenshots
        run: |
          python3 build_pages.py --check
          python3 build_pages.py
          python3 - <<'PY'
          import json,re,base64
          from pathlib import Path
          pl=json.loads(Path('_site/articles.json').read_text(encoding='utf-8'))
          en=json.loads(Path('_site/articles.en.json').read_text(encoding='utf-8'))
          assert pl['revision']==47 and en['revision']==17
          for language,packet in [('pl',pl),('en',en)]:
              article=next(a for a in packet['articles'] if a['id']=='casino')
              images=re.findall(r'data:image/webp;base64,([A-Za-z0-9+/=]+)',article['content'])
              assert len(images)==3,(language,len(images))
              for image in images:
                  blob=base64.b64decode(image,validate=True)
                  assert blob[:4]==b'RIFF' and blob[8:12]==b'WEBP'
              assert len(article['content'])<350000
              assert '1 Jade Orb' in article['content'] and '1000 ₽' in article['content']
              assert '@@MECH_IMAGE:' not in article['content']
          print("Both casino articles are valid and completely offline.")
          PY
      - name: Commit approved WebP images and remove temporary ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/casino-hall.webp assets/screenshots/casino-blackjack.webp assets/screenshots/casino-slots.webp
          if [ -f eryndor-wiki-v48-casino-screenshots.zip ]; then
            git rm -f eryndor-wiki-v48-casino-screenshots.zip
          fi
          if ! git diff --cached --quiet; then
            git commit -m "assets(wiki v48): add 3 approved casino screenshots"
            git push origin HEAD:wiki-v48-casino-screenshots
          fi
      - name: Merge approved PR into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge 11 --repo "${{ github.repository }}" --squash --subject "Wiki v48: casino article with 3 approved offline screenshots"
      - name: Trigger GitHub Pages publication for main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "${{ github.repository }}"
