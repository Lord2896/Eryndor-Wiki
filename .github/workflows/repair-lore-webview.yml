name: Repair Chronicle V and VI images for Android WebView
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-lore-webview.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  repair-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current Wiki
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install image dependencies
        run: python3 -m pip install 'Pillow>=10,<13' 'numpy>=1.26,<3'
      - name: Optimize images and update Wiki to v41
        run: |
          python3 - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageOps
          import re

          for filename in ('story-05-citadel.webp', 'story-06-homecoming.webp'):
              path = Path('assets/lore') / filename
              if not path.is_file():
                  raise FileNotFoundError(f'Missing approved image: {path}')
              with Image.open(path) as src:
                  im = ImageOps.exif_transpose(src).convert('RGB')
              original_size = im.size
              if im.width > 960:
                  h = round(im.height * 960 / im.width)
                  im = im.resize((960, h), Image.Resampling.LANCZOS)
              assert abs(im.width / im.height - 16/9) < 0.08, (filename, im.size)
              encoded = None
              for quality in (60, 50, 40, 30, 20):
                  out = BytesIO()
                  im.save(out, format='WEBP', quality=quality, method=4)
                  if out.tell() <= 105000:
                      encoded = out.getvalue()
                      break
              if encoded is None:
                  raise RuntimeError(f'Could not reduce {filename} to <=105KB')
              with Image.open(BytesIO(encoded)) as verify:
                  verify.load()
                  assert verify.format == 'WEBP' and verify.size == im.size
              path.write_bytes(encoded)
              print(f'{filename}: {original_size} => {im.size}, {len(encoded)} bytes', flush=True)

          codepath = Path('build_pages.py')
          code = codepath.read_text(encoding='utf-8')
          original = 'assert len(article["content"]) < 1200000, "Chronicle image exceeds Android WebView size limit"'
          safe = 'assert len(article["content"]) < 350000, "Chronicle image exceeds Android WebView size limit"'
          if original in code:
              codepath.write_text(code.replace(original, safe), encoding='utf-8')
          else:
              assert safe in code, 'Unexpected article size check in build_pages.py'

          validatepath = Path('.github/workflows/validate-bilingual.yml')
          checks = validatepath.read_text(encoding='utf-8')
          original = "a['id'] in ('chronicles-story-2','chronicles-story-3')"
          updated = "a['id'] in ('chronicles-story-2','chronicles-story-3','chronicles-story-5','chronicles-story-6')"
          if original in checks:
              validatepath.write_text(checks.replace(original, updated), encoding='utf-8')
          else:
              assert updated in checks, 'Unexpected Chronicle validation rule'

          articlespath = Path('articles.json')
          data = articlespath.read_text(encoding='utf-8')
          match = re.search(r'("revision"\s*:\s*)(\d+)', data)
          assert match, 'No revision found'
          current = int(match.group(2))
          if current == 40:
              data = data[:match.start(2)] + '41' + data[match.end(2):]
              articlespath.write_text(data, encoding='utf-8')
          else:
              assert current == 41, f'Unexpected wiki revision {current}'
          print('Wiki revision:', 41, flush=True)
          PY
      - name: Build and verify all offline article images
        run: |
          python3 build_pages.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import base64,json,re
          packet=json.loads(Path('_site/articles.json').read_text(encoding='utf-8'))
          assert packet['revision']==41
          for item in packet['articles']:
              if item['id'] not in ('chronicles-story-2','chronicles-story-3','chronicles-story-5','chronicles-story-6'):
                  continue
              images=re.findall(r'data:image/webp;base64,([A-Za-z0-9+/=]+)', item['content'])
              assert len(images)==1, f'Wrong image count for {item["id"]}'
              decoded=base64.b64decode(images[0],validate=True)
              with Image.open(BytesIO(decoded)) as picture:
                  picture.load()
                  assert picture.format=='WEBP'
              assert len(item['content'])<350000, (item['id'],len(item['content']))
              print(item['id'],len(decoded),'bytes',flush=True)
          PY
      - name: Commit tested v41 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lore/story-05-citadel.webp assets/lore/story-06-homecoming.webp build_pages.py articles.json .github/workflows/validate-bilingual.yml
          if ! git diff --cached --quiet; then
            git commit -m "Wiki v41: optimize approved Chronicle artwork for offline Android"
            git push origin HEAD:main
          else
            echo "Wiki v41 already committed"
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish verified Wiki
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
