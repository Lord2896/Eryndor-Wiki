name: Repair Chronicle V and VI images for Android WebView
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-lore-webview.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install image tooling
        run: python3 -m pip install 'Pillow>=10,<13' 'numpy>=1.26,<3'
      - name: Recompress WebP and restore Android-safe article limit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageOps
          import json
          root = Path('assets/lore')
          names = ['story-05-citadel.webp', 'story-06-homecoming.webp']
          for name in names:
              path = root / name
              assert path.is_file(), f'Missing approved illustration: {path}'
              with Image.open(path) as opened:
                  original = ImageOps.exif_transpose(opened).convert('RGB')
              print(f'{name}: before={path.stat().st_size} bytes, size={original.size}', flush=True)
              chosen = None
              for cap_width in (1440, 1280, 1152, 1024, 896):
                  scale = min(1.0, cap_width / original.width)
                  dim = (max(1, round(original.width * scale)), max(1, round(original.height * scale)))
                  im = original if dim == original.size else original.resize(dim, Image.Resampling.LANCZOS)
                  for quality in (76, 68, 60, 52, 44, 36, 28, 22):
                      out = BytesIO()
                      im.save(out, format='WEBP', quality=quality, method=6)
                      data = out.getvalue()
                      if len(data) <= 125000:
                          chosen = (data, dim, quality)
                          break
                  if chosen:
                      break
              assert chosen, f'Cannot compress {name} to safe WebView size'
              data, dimensions, quality = chosen
              assert 20000 < len(data) < 130000
              with Image.open(BytesIO(data)) as verify:
                  verify.load()
                  assert verify.format == 'WEBP' and verify.size == dimensions
              path.write_bytes(data)
              print(f'{name}: after={len(data)} bytes, size={dimensions}, quality={quality}', flush=True)

          codepath = Path('build_pages.py')
          code = codepath.read_text(encoding='utf-8')
          old = 'assert len(article["content"]) < 1200000, "Chronicle image exceeds Android WebView size limit"'
          new = 'assert len(article["content"]) < 350000, "Chronicle image exceeds Android WebView size limit"'
          assert code.count(old) == 1 or code.count(new) == 1, 'Unexpected Chronicle limit'
          if old in code:
              codepath.write_text(code.replace(old, new, 1), encoding='utf-8')

          checkpath = Path('.github/workflows/validate-bilingual.yml')
          checks = checkpath.read_text(encoding='utf-8')
          old = "a['id'] in ('chronicles-story-2','chronicles-story-3')"
          new = "a['id'] in ('chronicles-story-2','chronicles-story-3','chronicles-story-5','chronicles-story-6')"
          assert checks.count(old) == 1 or checks.count(new) == 1, 'Unexpected lore validator'
          if old in checks:
              checkpath.write_text(checks.replace(old, new, 1), encoding='utf-8')

          articlespath = Path('articles.json')
          article_text = articlespath.read_text(encoding='utf-8')
          token_old = '"revision": 40,'
          token_new = '"revision": 41,'
          assert article_text.count(token_old) == 1 or article_text.count(token_new) == 1, 'Unexpected revision'
          if token_old in article_text:
              articlespath.write_text(article_text.replace(token_old, token_new, 1), encoding='utf-8')
          print('Revision advanced to 41. Original text and selected illustrations preserved.')
          PY
      - name: Validate generated offline articles
        run: |
          python3 build_pages.py
          python3 - <<'PY'
          import json,re,base64
          from pathlib import Path
          packet=json.loads(Path('_site/articles.json').read_text(encoding='utf-8'))
          assert packet['revision']==41
          for article in packet['articles']:
              if article['id'] not in ('chronicles-story-2','chronicles-story-3','chronicles-story-5','chronicles-story-6'):
                  continue
              content=article['content']
              found=re.findall(r'data:image/webp;base64,([A-Za-z0-9+/=]+)', content)
              assert len(found)==1, f'Expected one embedded image: {article["id"]}'
              decoded=base64.b64decode(found[0], validate=True)
              assert decoded[:4]==b'RIFF' and decoded[8:12]==b'WEBP'
              assert len(content)<350000, (article['id'],len(content))
              print(article['id'], 'article characters',len(content),'WebP bytes',len(decoded))
          PY
      - name: Commit tested repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lore/story-05-citadel.webp assets/lore/story-06-homecoming.webp build_pages.py articles.json .github/workflows/validate-bilingual.yml
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Repair already committed; proceeding to deploy"
          else
            git commit -m "Wiki v41: fix broken offline Chronicle V and VI illustrations"
            git push origin HEAD:main
          fi

  publish:
    needs: repair
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install image renderer dependencies
        run: python3 -m pip install 'Pillow>=10,<13' 'numpy>=1.26,<3'
      - name: Build validated offline wiki feed
        run: python3 build_pages.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
