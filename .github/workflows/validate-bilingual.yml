name: Validate Eryndor Wiki PL-EN
on:
  push:
    branches: [wiki-v0.6.0-pl-en, wiki-kroniki-2026-10-19, wiki-v42-chronicles-1-4-artwork, main]
    paths:
      - 'articles.json'
      - 'translations/**'
      - 'build_pages.py'
      - 'render_backpacks.py'
      - 'render_waystones.py'
      - 'assets/**'
      - '.github/workflows/validate-bilingual.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install image generator dependencies
        run: python3 -m pip install 'Pillow>=10,<13' 'numpy>=1.26,<3'
      - name: Validate legacy PL feed
        run: python3 build_pages.py --check
      - name: Validate Python syntax
        run: python3 -m py_compile build_pages.py render_backpacks.py render_waystones.py
      - name: Generate both language feeds and verify manifest
        run: |
          python3 build_pages.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          site=Path('_site')
          legacy=json.loads((site/'manifest.json').read_text())
          meta=json.loads((site/'manifest-v2.json').read_text())
          assert legacy['schema']==1 and meta['schema']==2
          assert legacy['revision']==meta['languages']['pl']['revision']
          pl_packet=json.loads((site/'articles.json').read_text())
          en_packet=json.loads((site/'articles.en.json').read_text())
          pl_ids=[a['id'] for a in pl_packet['articles']]
          en_ids={a['id'] for a in en_packet['articles']}
          chronicle_ids=[
            'chronicles-story-1','chronicles-story-2','chronicles-story-3',
            'chronicles-story-4','chronicles-story-5','chronicles-story-6',
            'chronicles-peoples','chronicles-introduction','chronicles-trials'
          ]
          assert len(pl_ids)==26 and pl_ids[-14:-5]==chronicle_ids and pl_ids[-5:]==['ascension','trade-chain','auras','cosmetics','move-tutors'], (len(pl_ids),pl_ids[-14:])
          assert len(en_ids)==18 and {'ascension','trade-chain','auras','cosmetics','move-tutors'}.issubset(en_ids), len(en_ids)
          assert set(pl_ids)-en_ids==set(chronicle_ids[:-1]), "Unexpected missing English articles"
          for locale,entry in meta['languages'].items():
              blob=(site/entry['file']).read_bytes()
              packet=json.loads(blob)
              assert packet['revision']==entry['revision']
              assert hashlib.sha256(blob).hexdigest()==entry['sha256']
              ids={a['id'] for a in packet['articles']}
              assert len(ids)==len(packet['articles']), "Duplicated article ID"
              assert ids.issubset(set(pl_ids)), (locale,ids-set(pl_ids))
              for a in packet['articles']:
                  assert not re.search(r'@@(?:BACKPACK|WAYSTONES)_CARD:|@@COOKING_IMAGE@@|@@LORE_IMAGE:',a['content'])
                  if locale == 'pl' and a['id'] in ('chronicles-story-1','chronicles-story-2','chronicles-story-3','chronicles-story-4','chronicles-story-5','chronicles-story-6'):
                      assert a['content'].count('data:image/webp;base64,') == 1, ('missing lore illustration',a['id'])
                      assert a['content'].count('<img class="recipe-image"') == 1, ('missing Android-compatible lore img',a['id'])
                      assert '<figure' not in a['content'], ('unsupported lore figure wrapper',a['id'])
                      assert '<p class="lore-image"' in a['content'], ('missing lore paragraph',a['id'])
                      assert a['content'].startswith('<p><strong>'), ('missing bold lead sentence',a['id'])
                      assert not re.search(r'<figcaption|<p[^>]*>\s*<em>',a['content']), ('unexpected artwork caption',a['id'])
                      assert len(a['content']) < 350000, ('Lore exceeds Android legacy article limit',a['id'])
                  for target in re.findall(r'data-go="([^"]+)"',a['content']):
                      assert target in pl_ids, (locale,a['id'],target)
          assert meta['languages']['pl']['sha256']==legacy['sha256']
          print("26 Polish articles; 18 English articles; 8 full-length Chronicles use documented Polish fallback.")
          PY

      - name: Record successful v42 prepublication smoke test
        if: github.ref == 'refs/heads/wiki-v42-chronicles-1-4-artwork'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,base64,re
          from PIL import Image
          info={}
          for num, filename in [(1,'story-01-archipelago.webp'),(4,'story-04-ravine-battle.webp')]:
              path=Path('assets/lore')/filename
              binary=path.read_bytes()
              with Image.open(path) as im:
                  im.load()
                  assert im.format=='WEBP'
                  dims=im.size
              blob=json.loads(Path('_site/articles.json').read_text())
              a=next(a for a in blob['articles'] if a['id']==f'chronicles-story-{num}')
              im_b64=re.findall(r'data:image/webp;base64,([A-Za-z0-9+/=]+)',a['content'])
              assert len(im_b64)==1 and base64.b64decode(im_b64[0])==binary
              assert len(a['content'])<350000
              info[filename]={'sha256':hashlib.sha256(binary).hexdigest(),'dimensions':list(dims)}
          assert blob['revision']==42
          Path('.github/v42-image-validation.json').write_text(json.dumps({'revision':42,'images':info},indent=2)+'\n')
          print('Validated and documented Chronicle I and IV embedded images')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/v42-image-validation.json
          git commit -m "test: record v42 Chronicle artwork validation"
          git push origin HEAD:wiki-v42-chronicles-1-4-artwork
