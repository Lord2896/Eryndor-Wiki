# Copy this workflow into the PUBLIC Eryndor-Wiki repository:
# .github/workflows/deploy-pages.yml
# alongside articles.json and build_pages.py at repository root.
name: Publish Eryndor Wiki content
on:
  push:
    branches: [main]
    paths:
      - 'articles.json'
      - 'translations/**'
      - 'build_pages.py'
      - 'render_backpacks.py'
      - 'render_waystones.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image renderer dependencies
        run: python3 -m pip install 'Pillow>=10,<13' 'numpy>=1.26,<3'
      - name: Validate and build JSON content
        run: python3 build_pages.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
