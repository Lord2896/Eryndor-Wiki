name: Prepare English Chronicles draft (v47)
on:
  push:
    branches: [wiki-v47-chronicles-en-draft]
    paths:
      - '.github/workflows/draft-chronicles-en-v47.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-v47-chronicles-en-draft
  cancel-in-progress: false

jobs:
  translate-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiki-v47-chronicles-en-draft
          fetch-depth: 0
      - name: Install translation and Wiki validation dependencies
        run: python3 -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'Pillow>=10,<13' 'numpy>=1.26,<3'
      - name: Translate missing Chronicles to English on staging branch
        run: python3 .github/scripts/translate_chronicles_v47.py
      - name: Verify 29 EN articles and exact offline illustration markers
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          pl=json.loads(Path('articles.json').read_text(encoding='utf8'))
          en=json.loads(Path('translations/en.json').read_text(encoding='utf8'))
          assert pl['revision']==46 and en['revision']==16
          sources={a['id']:a for a in pl['articles']}
          assert set(en['articles'])==set(sources) and len(sources)==29
          for key in ('chronicles-story-1','chronicles-story-2','chronicles-story-3','chronicles-story-4','chronicles-story-5','chronicles-story-6','chronicles-peoples','chronicles-introduction'):
              src=sources[key]
              tr=en['articles'][key]
              assert tr['sourceUpdatedAt']==src['updatedAt']
              assert tr['content'].count('@@LORE_IMAGE:'+key+'@@')==1
              assert tr['content'].count('<p')==src['content'].count('<p'),key
              assert tr['content'].count('<h3>')==src['content'].count('<h3>'),key
              assert re.findall('data-go="([^"]+)"',tr['content'])==re.findall('data-go="([^"]+)"',src['content']),key
              assert len(tr['content'])>len(src['content'])*0.65,key
          print('All 8 complete translations retain markup and 29 articles have EN entries.')
          PY
          python3 build_pages.py --check
          python3 build_pages.py
      - name: Commit translated draft ONLY (do not publish)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/en.json
          if git diff --cached --quiet; then
            echo "No pending translations"
          else
            git commit -m "docs(wiki v47): draft eight full English Chronicles and peoples"
            git push origin HEAD:wiki-v47-chronicles-en-draft
          fi
