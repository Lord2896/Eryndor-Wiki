<title id="title">Kociołek Kulinarny — crafting</title><desc id="desc">Rząd 1: sztabka miedzi, pusty, sztabka miedzi. Rząd 2: sztabka żelaza, pusty, sztabka żelaza. Rząd 3: sztabka żelaza, blok żelaza, sztabka żelaza. Rezultat: Kociołek Kulinarny.</desc>
